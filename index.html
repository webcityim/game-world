<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game World</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" aria-live="off"></div>
    <div id="help">
      <b>操作</b><br />
      手柄(同 protea):右摇杆平移 · 左摇杆 前后/偏航 · 十字键 俯仰/翻滚 · L1/R1 加速 · L2/R2 缩放 · R3 切到 Roll 模式(十字键平移、右摇杆转向、左摇杆翻滚),L3 退出 · A 回正 · Y/X 切换书签<br />
      键鼠:拖动鼠标视角 · WASD 移动 · Space/C 升/降 · Q/E 翻滚 · L 回正 · Shift 加速 · Z 减速 · 滚轮缩放 · 1-6 书签
    </div>
    <div id="boot">正在初始化 WebGPU …</div>

    <!-- 原生 HTML-in-Canvas 的页面画布会被临时挂到这里(位于屏幕外) -->
    <div id="html-pages"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
