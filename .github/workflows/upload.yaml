name: Upload

# 部署流程参考 calcit-lang/respo-calcit-workflow:
#   1. 构建时把 VITE_BASE_URL 指向 CDN(腾讯云 COS)前缀
#   2. 静态资源上传到 COS
#   3. main 分支 push 时 rsync 到服务器;同仓库的 PR 发布到 /pr/ 预览目录
#
# 需要在仓库 Settings -> Secrets 里配置:
#   COS_BUCKET, COS_SECRET_ID, COS_SECRET_KEY, rsync_private_key

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: "load deps"
        run: |
          # 仓库初期还没有 yarn.lock 时允许生成;有了之后严格按锁文件安装
          if [ -f yarn.lock ]; then
            yarn install --immutable
          else
            yarn install --no-immutable
          fi

      - name: Typecheck
        run: yarn typecheck

      - name: Build client with CDN asset URLs
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/"
          fi
          echo "VITE_BASE_URL=${CDN_ORIGIN}/${asset_prefix}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${CDN_ORIGIN}/${asset_prefix}" >> "$GITHUB_OUTPUT"
          export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
          yarn release

      - name: Upload static assets to COS
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Deploy PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}/pr/"
